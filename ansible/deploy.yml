---
# Déploie Legeni WebApp dans Kubernetes, avec smoke test et rollback automatique.
#   ansible-playbook deploy.yml -e target_env=staging -e app_version=1.1.0-37 --vault-password-file <fichier>
# Prérequis : variable d'environnement KUBECONFIG, librairie Python kubernetes, collection kubernetes.core
- name: Déploiement Kubernetes de Legeni WebApp
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/vault.yml

  vars:
    target_env: staging
    app_image: christlk/legeni-webapp
    app_version: ""
    new_pods: >-
      {{ pods.resources | selectattr('metadata.deletionTimestamp', 'undefined')
      | selectattr('status.phase', 'equalto', 'Running')
      | selectattr('spec.containers.0.image', 'equalto', app_image ~ ':' ~ app_version)
      | map(attribute='metadata.name') | list }}

  pre_tasks:
    - name: Vérifier les paramètres
      ansible.builtin.assert:
        that:
          - target_env in ['staging', 'prod']
          - app_version | length > 0
          - app_version != 'latest'
        fail_msg: "target_env doit valoir staging ou prod, et app_version doit être explicite (jamais latest)"

    - name: Charger les variables de l'environnement cible
      ansible.builtin.include_vars: "vars/{{ target_env }}.yml"

  tasks:
    - name: Créer le namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"
            labels: {env: "{{ app_env }}"}

    - name: Créer le secret Redis
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: redis-secret
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData:
            REDIS_PASSWORD: "{{ redis_password }}"
      no_log: true

    - name: Déployer avec rollback automatique en cas d'échec
      block:
        - name: Appliquer les manifests et attendre la fin du rolling update
          kubernetes.core.k8s:
            state: present
            template: templates/k8s/webapp.yml.j2
            wait: true
            wait_timeout: 180

        - name: Attendre un pod de la nouvelle version
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ k8s_namespace }}"
            label_selectors: ["app=webapp"]
          register: pods
          until: new_pods | length > 0
          retries: 10
          delay: 3
        - name: Smoke test depuis le cluster
          kubernetes.core.k8s_exec:
            namespace: "{{ k8s_namespace }}"
            pod: "{{ new_pods | first }}"
            command: >-
              python -c "import json,urllib.request;
              d=json.load(urllib.request.urlopen('http://webapp/api/info'));
              assert d['version']=='{{ app_version }}', d; print(d)"
          register: smoke
          changed_when: false

        - name: Résultat
          ansible.builtin.debug:
            msg: "{{ app_env }} OK : {{ smoke.stdout | trim }}"

      rescue:
        - name: Retour à la version précédente
          kubernetes.core.k8s_rollback:
            api_version: apps/v1
            kind: Deployment
            name: webapp
            namespace: "{{ k8s_namespace }}"

        - name: Échouer explicitement (le pipeline doit passer au rouge)
          ansible.builtin.fail:
            msg: "Déploiement de {{ app_version }} en {{ app_env }} échoué : rollback effectué"